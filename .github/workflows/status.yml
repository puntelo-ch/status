# Statusseite status.puntelo.ch (ADR-0027): alle 5 Minuten und bei jeder neuen Meldung bauen und auf
# GitHub Pages veröffentlichen. Quelle: infra/status im Repository puntelo-ch/puntelo, übertragen mit
# infra/status/publish.sh. Meldungen nur in meldungen/ dieses Repositorys.
name: status

on:
  schedule:
    # Nicht zur vollen Stunde: Dann verschiebt oder verwirft GitHub geplante Läufe am häufigsten.
    - cron: "3-58/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Tests
        run: node --test test/*.test.mjs
      - name: Build
        env:
          UPTIMEROBOT_READONLY_KEY: ${{ secrets.UPTIMEROBOT_READONLY_KEY }}
          HC_PING_STATUS_PAGE: ${{ secrets.HC_PING_STATUS_PAGE }}
        run: node build.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
